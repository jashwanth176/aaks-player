name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

# Read only, apart from the release job below
permissions:
  contents: read

# Actions are pinned to commits

jobs:
  build:
    runs-on: ubuntu-latest
    # Whether the release APK was signed, which decides if the release job runs
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Install the NDK the project pins
        # yes dies of SIGPIPE under pipefail once sdkmanager stops reading
        run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" > /dev/null

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Native unit tests
        run: make -C app/src/test/cpp test

      - name: Translations
        run: python3 tools/check_strings.py

      # Tag builds sign with the keystore from repository secrets, if set
      - name: Signing key
        id: sign
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing key in the secrets, the release APK stays unsigned and is not attached to the release"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=${KEY_ALIAS:-moonlightvr}
          EOF

      - name: Build
        run: ./gradlew --no-daemon assembleDebug assembleRelease lintRelease

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aaks-release
          path: app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore

  # Attaches the signed APK to the tag's release; the only job with write access
  release:
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.signed == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aaks-release
          path: apk

      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: apk/*.apk
          generate_release_notes: true
